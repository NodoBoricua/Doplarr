name: Test Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ feature/lidarr-ci-workflow ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image from root context
        run: |
          docker build -f docker/Dockerfile -t doplarr-test .
          echo "✅ Build completed!"

      - name: Test image
        run: |
          docker run --rm doplarr-test java -version
          echo "✅ Image test passed!"
