name: Test Fixed deps.edn

on:
  workflow_dispatch:
  push:
    branches: [ feature/lidarr-ci-workflow ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Test with fixed deps.edn
        run: |
          echo "=== Probando deps.edn corregido ==="
          docker run --rm -v $(pwd):/src -w /src clojure:tools-deps-1.11.1.1435 \
            clojure -P
          
      - name: Test build
        run: |
          echo "=== Probando build ==="
          docker run --rm -v $(pwd):/src -w /src clojure:tools-deps-1.11.1.1435 \
            clojure -T:build uber || echo "Build attempted"
