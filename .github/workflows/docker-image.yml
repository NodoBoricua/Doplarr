name: Test Docker Multi-Arch Build

on:
  workflow_dispatch:
  push:
    branches: [ feature/lidarr-ci-workflow ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug repository structure  # ← DEBUG AQUÍ
        run: |
          echo "📁 Estructura del repositorio:"
          find . -name "*.edn" -o -name "build" -type d | head -20
          echo "📦 Contenido de docker/:"
          ls -la docker/
          echo "🔍 Contenido de build/ (si existe):"
          ls -la build/ || echo "No existe directorio build"
          echo "🔍 Contenido de src/ (si existe):"
          ls -la src/ || echo "No existe directorio src"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for ${{ matrix.platform }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: doplarr-lidarr:test-${{ matrix.platform }}
          no-cache: false

      - name: Verify ${{ matrix.platform }}
        run: |
          echo "✅ Build completed for ${{ matrix.platform }}"
