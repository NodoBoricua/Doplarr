name: CI/CD Multi-Arch Docker Build

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    env:
      IMAGE_NAME: doplarr-lidarr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        if: env.DOCKER_USERNAME && env.DOCKER_PASSWORD
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set image tags
        id: meta
        run: |
          IMAGE_NAME=doplarr-lidarr
          GHCR_TAGS="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:latest"
          DOCKER_TAGS=""

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            GHCR_TAGS="$GHCR_TAGS,ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:$VERSION"
            DOCKER_TAGS="docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest,docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:$VERSION"
          else
            SHA_TAG=${GITHUB_SHA::7}
            GHCR_TAGS="$GHCR_TAGS,ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:$SHA_TAG"
            DOCKER_TAGS="docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:latest,docker.io/${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:$SHA_TAG"
          fi

          echo "ghcr_tags=$GHCR_TAGS" >> $GITHUB_OUTPUT
          echo "docker_tags=$DOCKER_TAGS" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ${{ steps.meta.outputs.ghcr_tags }}
            ${{ steps.meta.outputs.docker_tags }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false



