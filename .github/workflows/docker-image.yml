name: Debug Clojure Build

on:
  workflow_dispatch:
  push:
    branches: [ feature/lidarr-ci-workflow ]

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Test structure and basic commands
        run: |
          echo "=== Estructura del proyecto ==="
          find . -name "*.edn" -o -name "*.clj" | head -20
          echo ""
          
          echo "=== Contenido de deps.edn ==="
          cat deps.edn || echo "No se puede leer deps.edn"
          echo ""
          
          echo "=== Verificando build.clj ==="
          cat build/build.clj || echo "No se puede leer build/build.clj"
          echo ""
          
          echo "=== Archivos en src/doplarr/ ==="
          find src/doplarr/ -name "*.clj" | head -10
          echo ""
          
          echo "=== Probando con Docker simplificado ==="

      - name: Build with simple Dockerfile
        run: |
          # Crear Dockerfile temporal mínimo
          cat > Dockerfile.simple << 'EOF'
          FROM clojure:tools-deps-1.11.1.1435
          WORKDIR /test
          COPY . .
          RUN echo "=== Listando archivos ===" && \
              find . -name "*.clj" -o -name "*.edn" | head -15 && \
              echo "=== Probando clojure -P ===" && \
              clojure -P && \
              echo "✅ clojure -P funcionó" || \
              echo "❌ clojure -P falló"
          EOF
          
          docker build -f Dockerfile.simple -t test-build .
