name: Test and Multi-Arch Build

on:
  workflow_dispatch:
  push:
    branches: [ feature/lidarr-ci-workflow ]
  pull_request:
    branches: [ feature/lidarr-ci-workflow ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Clojure and run tests
        uses: DeLaGuardo/setup-clojure@v12
        with:
          cli: latest
          
      - name: Run Clojure tests
        run: clojure -X:test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build and test multi-arch
        run: |
          # Build para ambas arquitecturas
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t doplarr-lidarr:test \
            --load .  # --load permite cargar las imágenes localmente para testing
          
          echo "=== Testing both architectures ==="
          for arch in amd64 arm64; do
            echo "Testing $arch..."
            docker run --rm --platform linux/$arch doplarr-lidarr:test test -f /app/doplarr.jar && echo "✅ $arch: Build successful"
          done


