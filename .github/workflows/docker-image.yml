name: Test Docker Multi-Arch Build

on:
  workflow_dispatch:
  push:
    branches: [ feature/lidarr-ci-workflow ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile  # ← Ruta corregida
          platforms: linux/amd64,linux/arm64
          push: false
          tags: doplarr-lidarr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build success
        run: |
          echo "✅ Multi-arch build completed successfully!"
          echo "📦 Testing that images can be loaded..."
          docker buildx ls

