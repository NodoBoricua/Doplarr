name: Docker Build Test

on:
  workflow_dispatch:
  push:
    branches: [ feature/lidarr-ci-workflow ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Verify exact structure
        run: |
          echo "=== Estructura exacta ==="
          ls -la src/doplarr/ || echo "❌ No existe src/doplarr/"
          find src/doplarr/ -name "*.clj" | head -5
          
      - name: Build
        run: |
          docker build -f docker/Dockerfile -t doplarr-test .
          echo "✅ Build completed!"
